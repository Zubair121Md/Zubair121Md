<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="separator">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.5s" repeatCount="indefinite" additive="sum"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="900" y2="12" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#line)" stroke-width="1.5"/>
  <circle cx="450" cy="12" r="3" fill="#60a5fa">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
