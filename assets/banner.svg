<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-label="Zubair Mohammed Ishaq  Founder @ MIA Solutions">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090d">
        <animate attributeName="stop-color" values="#07090d;#0a1018;#07090d" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0c121c"/>
      <stop offset="100%" stop-color="#080b12">
        <animate attributeName="stop-color" values="#080b12;#0d1522;#080b12" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0">
        <animate attributeName="offset" values="1;1.2;1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" from="-400 0" to="400 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1">
        <animate attributeName="offset" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.45"/>
    </pattern>

    <mask id="fadeMask">
      <rect width="1500" height="520" fill="url(#maskGrad)"/>
    </mask>
    <linearGradient id="maskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.9"/>
    </linearGradient>

    <clipPath id="frame">
      <rect width="1500" height="520" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1500" height="520" fill="url(#bgGrad)"/>
    <rect width="1500" height="520" fill="url(#grid)" opacity="0.7" mask="url(#fadeMask)"/>

    <!-- Ambient glows -->
    <ellipse cx="220" cy="160" rx="280" ry="160" fill="url(#glowBlue)" opacity="0.45">
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="220;260;220" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1180" cy="380" rx="320" ry="180" fill="url(#glowBlue)" opacity="0.35">
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="380;340;380" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="750" cy="80" rx="400" ry="100" fill="url(#glowBlue)" opacity="0.18">
      <animate attributeName="opacity" values="0.1;0.28;0.1" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Flowing gradient band -->
    <rect x="0" y="230" width="1500" height="60" fill="url(#flowGrad)" opacity="0.4"/>
    <rect x="0" y="0" width="1500" height="2" fill="#1e293b"/>
    <rect x="0" y="518" width="1500" height="2" fill="#1e293b"/>

    <!-- Network graph (right / center) -->
    <g opacity="0.85" filter="url(#softGlow)">
      <!-- Connection lines -->
      <g stroke="#334155" stroke-width="1" fill="none">
        <path d="M980 160 L1080 220 L1180 170 L1280 250 L1380 200">
          <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="4s" repeatCount="indefinite"/>
        </path>
        <path d="M1020 320 L1120 280 L1220 340 L1320 290">
          <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="5s" repeatCount="indefinite"/>
        </path>
        <path d="M1080 220 L1120 280 L1180 170 L1220 340" stroke="#3b82f6" stroke-opacity="0.35">
          <animate attributeName="stroke-opacity" values="0.2;0.65;0.2" dur="3.5s" repeatCount="indefinite"/>
        </path>
        <path d="M980 160 L1020 320" stroke="#475569" stroke-opacity="0.4"/>
        <path d="M1280 250 L1320 290" stroke="#475569" stroke-opacity="0.4"/>
      </g>

      <!-- Pulse along edges -->
      <circle r="3" fill="#93c5fd" filter="url(#softGlow)">
        <animateMotion dur="5s" repeatCount="indefinite" path="M980 160 L1080 220 L1180 170 L1280 250 L1380 200"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#60a5fa" filter="url(#softGlow)">
        <animateMotion dur="6.5s" repeatCount="indefinite" path="M1020 320 L1120 280 L1220 340 L1320 290"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="6.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Nodes -->
      <g>
        <circle cx="980" cy="160" r="14" fill="url(#nodeGlow)"/>
        <circle cx="980" cy="160" r="4" fill="#e2e8f0">
          <animate attributeName="r" values="3.5;5;3.5" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1080" cy="220" r="18" fill="url(#nodeGlow)"/>
        <circle cx="1080" cy="220" r="5" fill="#f8fafc">
          <animate attributeName="r" values="4;6;4" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1180" cy="170" r="12" fill="url(#nodeGlow)"/>
        <circle cx="1180" cy="170" r="3.5" fill="#cbd5e1"/>
        <circle cx="1280" cy="250" r="16" fill="url(#nodeGlow)"/>
        <circle cx="1280" cy="250" r="4.5" fill="#f1f5f9">
          <animate attributeName="r" values="4;5.5;4" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1380" cy="200" r="11" fill="url(#nodeGlow)"/>
        <circle cx="1380" cy="200" r="3" fill="#94a3b8"/>
        <circle cx="1020" cy="320" r="13" fill="url(#nodeGlow)"/>
        <circle cx="1020" cy="320" r="3.5" fill="#e2e8f0"/>
        <circle cx="1120" cy="280" r="15" fill="url(#nodeGlow)"/>
        <circle cx="1120" cy="280" r="4" fill="#f8fafc">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1220" cy="340" r="12" fill="url(#nodeGlow)"/>
        <circle cx="1220" cy="340" r="3.5" fill="#cbd5e1"/>
        <circle cx="1320" cy="290" r="14" fill="url(#nodeGlow)"/>
        <circle cx="1320" cy="290" r="4" fill="#e2e8f0"/>
      </g>
    </g>

    <!-- Floating particles -->
    <g fill="#94a3b8">
      <circle cx="180" cy="90" r="1.5" opacity="0.6">
        <animate attributeName="cy" values="90;70;90" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="400" r="1.2" opacity="0.5">
        <animate attributeName="cy" values="400;370;400" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="420;440;420" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="650" cy="120" r="1.4" opacity="0.55">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;100;120" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="450" r="1.1" opacity="0.4">
        <animate attributeName="cy" values="450;420;450" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="280" r="1.3" fill="#60a5fa" opacity="0.5">
        <animate attributeName="cx" values="300;330;300" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="540" cy="60" r="1" opacity="0.45">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="380" r="1.2" fill="#93c5fd" opacity="0.4">
        <animate attributeName="cy" values="380;350;380" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="440" r="1.5" opacity="0.35">
        <animate attributeName="cx" values="140;170;140" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="300" r="1" fill="#60a5fa" opacity="0.5">
        <animate attributeName="r" values="0.8;1.8;0.8" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1450" cy="90" r="1.3" opacity="0.4">
        <animate attributeName="cy" values="90;110;90" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Left: Identity -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      <text x="72" y="78" fill="#64748b" font-size="13" letter-spacing="3.5">MISSION CONTROL // PROFILE</text>

      <text x="72" y="175" fill="url(#textShine)" font-size="42" font-weight="700" letter-spacing="4" filter="url(#textGlow)">ZUBAIR MOHAMMED ISHAQ</text>

      <text x="72" y="230" fill="#94a3b8" font-size="22" letter-spacing="1.5">Founder @ MIA Solutions</text>

      <text x="72" y="280" fill="#64748b" font-size="15" letter-spacing="2.5">AI  ·  Business Analysis  ·  ERP  ·  Automation</text>

      <!-- Accent line under name -->
      <rect x="72" y="195" width="0" height="2" fill="#3b82f6" opacity="0.85">
        <animate attributeName="width" values="0;420;420" dur="2.2s" fill="freeze"/>
        <animate attributeName="opacity" values="0.85;0.45;0.85" dur="4s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Right: Status panel -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      <rect x="1120" y="48" width="320" height="118" rx="8" fill="#0f172a" fill-opacity="0.72" stroke="#1e293b" stroke-width="1"/>
      <rect x="1120" y="48" width="4" height="118" rx="1" fill="#3b82f6">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </rect>

      <text x="1144" y="82" fill="#64748b" font-size="11" letter-spacing="2.5">SYSTEM STATUS</text>

      <circle cx="1154" cy="112" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1154" cy="112" r="9" fill="none" stroke="#22c55e" stroke-opacity="0.35">
        <animate attributeName="r" values="7;13;7" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="1172" y="117" fill="#e2e8f0" font-size="16" font-weight="600" letter-spacing="2">STATUS: BUILDING</text>

      <text x="1144" y="148" fill="#64748b" font-size="12" letter-spacing="1.5">Version: 2026.08</text>
    </g>

    <!-- Bottom bar -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      <rect x="0" y="470" width="1500" height="50" fill="#020617" fill-opacity="0.55"/>
      <text x="72" y="500" fill="#475569" font-size="12" letter-spacing="1.5">AI  ·  ANALYZE  ·  ERP  ·  AUTOMATE</text>
      <text x="1180" y="500" fill="#334155" font-size="11" letter-spacing="1">UPDATED 2026.08.13</text>
    </g>
  </g>
</svg>
